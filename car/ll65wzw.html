  <style>
    :root {
      --bg: #f3f1ed;
      --paper: #fffdf9;
      --ink: #1e1b18;
      --ink-soft: #5e554d;
      --line: #d9cec2;
      --ok: #2f7f5f;
      --bad: #b00020;
      --shadow: 0 12px 30px rgba(41, 26, 16, 0.08);
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      padding: 0;
      background:
        radial-gradient(circle at 15% 0%, #fff8f1 0%, transparent 45%),
        radial-gradient(circle at 100% 30%, #f6ebe3 0%, transparent 40%),
        var(--bg);
      color: var(--ink);
      font-family: "Segoe UI", "Trebuchet MS", "Gill Sans", sans-serif;
      line-height: 1.45;
    }

    .page {
      width: min(1120px, 92vw);
      margin: 28px auto 42px;
      display: grid;
      gap: 18px;
    }

    .card {
      background: var(--paper);
      border: 1px solid var(--line);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow);
      padding: 18px;
    }

    .hero {
      display: grid;
      gap: 16px;
      background: linear-gradient(135deg, #fffdf8 0%, #fff4ec 65%, #fde8df 100%);
      position: relative;
      overflow: hidden;
    }

    .hero::after {
      content: "";
      position: absolute;
      right: -60px;
      bottom: -60px;
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: rgba(176, 74, 47, 0.1);
    }

    .hero-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 14px;
      z-index: 1;
    }

        .hero-main {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 320px;
            gap: 16px;
            align-items: center;
            z-index: 1;
        }

        .hero-photo {
            margin: 0;
            border: 1px solid rgba(31, 24, 20, 0.12);
            border-radius: 14px;
            overflow: hidden;
            background: #fff;
            box-shadow: 0 10px 24px rgba(42, 28, 19, 0.14);
            aspect-ratio: 4 / 3;
        }

        .hero-photo img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

    .title {
      margin: 0;
      font-size: clamp(1.5rem, 2.6vw, 2.3rem);
      letter-spacing: 0.02em;
      font-weight: 780;
    }

    .subtitle {
      margin: 4px 0 0;
      color: var(--ink-soft);
      font-size: 0.97rem;
    }

    .plate {
      display: inline-flex;
      align-items: center;
      border: 1px solid #b69672;
      background: #fef1b6;
      color: #231d14;
      border-radius: 10px;
      padding: 10px 12px;
      font-weight: 760;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      min-width: 142px;
      justify-content: center;
      font-size: 1.05rem;
      z-index: 1;
    }

    .chip-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      z-index: 1;
    }

    .chip {
      border: 1px solid var(--line);
      background: #fff;
      color: #3f362e;
      border-radius: 999px;
      padding: 6px 11px;
      font-size: 0.86rem;
      font-weight: 600;
    }

    .chip.ok { color: var(--ok); }
    .chip.bad { color: var(--bad); }

    .section-title {
      margin: 0 0 12px;
      font-size: 1.06rem;
      letter-spacing: 0.02em;
      font-weight: 760;
    }

    .kpi-grid, .price-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 10px;
    }

    .kpi {
      border: 1px dashed #d8cabe;
      background: #fff;
      border-radius: var(--radius-md);
      padding: 12px;
    }

    .kpi-label {
      margin: 0;
      color: var(--ink-soft);
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
    }

    .kpi-value {
      margin: 5px 0 0;
      font-size: 1.08rem;
      font-weight: 760;
    }

    .grid-two {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .spec-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 10px;
    }

    .spec-item {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 10px;
      background: #fff;
    }

    .spec-label {
      margin: 0;
      color: var(--ink-soft);
      font-size: 0.82rem;
    }

    .spec-value {
      margin: 2px 0 0;
      font-size: 0.98rem;
      font-weight: 650;
    }

    .timeline {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 10px;
    }

    .timeline li {
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: #fff;
      padding: 12px;
      display: grid;
      gap: 8px;
    }

    .row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      flex-wrap: wrap;
    }

    .badge {
      border-radius: 999px;
      padding: 5px 9px;
      font-weight: 700;
      font-size: 0.78rem;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      border: 1px solid transparent;
    }

    .badge.pass { color: var(--ok); border-color: #a5d2be; background: #edf8f2; }
    .badge.fail { color: var(--bad); border-color: #db9da8; background: #fdecef; }

    .notes {
      margin: 0;
      padding-left: 18px;
      color: #413730;
      font-size: 0.92rem;
      display: grid;
      gap: 4px;
    }

    .features-wrap { display: grid; gap: 8px; }

    details {
      border: 1px solid var(--line);
      border-radius: var(--radius-md);
      background: #fff;
      overflow: hidden;
    }

    summary {
      cursor: pointer;
      list-style: none;
      padding: 11px 13px;
      font-weight: 680;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: linear-gradient(180deg, #fff, #fffcf9);
    }

    summary::-webkit-details-marker { display: none; }

    .summary-meta {
      color: var(--ink-soft);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .feature-list {
      margin: 0;
      padding: 0 13px 12px;
      list-style: none;
      display: grid;
      gap: 8px;
    }

    .feature-item {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 8px 10px;
      background: #fffcfa;
      display: grid;
      gap: 2px;
    }

    .feature-name {
      margin: 0;
      font-size: 0.92rem;
      font-weight: 650;
    }

    .feature-meta {
      margin: 0;
      color: var(--ink-soft);
      font-size: 0.83rem;
    }

    .foot {
      text-align: center;
      color: var(--ink-soft);
      font-size: 0.82rem;
      padding-top: 2px;
    }

    .check-flags {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 16px;
    }

    .flag {
      border-radius: 999px;
      padding: 6px 12px;
      font-size: 0.86rem;
      font-weight: 650;
      border: 1px solid transparent;
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .flag.clear { color: var(--ok); border-color: #a5d2be; background: #edf8f2; }
    .flag.alert { color: var(--bad); border-color: #db9da8; background: #fdecef; }
    .flag.warn  { color: #7a5000; border-color: #e5c97a; background: #fef9ec; }

    .check-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .odometer-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }

    .odometer-table th {
      text-align: left;
      color: var(--ink-soft);
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      padding: 6px 8px;
      border-bottom: 1px solid var(--line);
    }

    .odometer-table td {
      padding: 7px 8px;
      border-bottom: 1px solid #f0ebe4;
      font-weight: 500;
    }

    .odometer-table tr:last-child td { border-bottom: none; }

    .plate-changes {
      list-style: none;
      margin: 0;
      padding: 0;
      display: grid;
      gap: 8px;
    }

    .plate-change-item {
      border: 1px solid var(--line);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      background: #fff;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      font-size: 0.92rem;
    }

    .plate-tag {
      display: inline-block;
      border: 1px solid #b69672;
      background: #fef1b6;
      color: #231d14;
      border-radius: 6px;
      padding: 3px 8px;
      font-weight: 760;
      letter-spacing: 0.06em;
      font-size: 0.88rem;
    }

    .plate-arrow { color: var(--ink-soft); font-size: 0.85rem; }

    @media (max-width: 880px) {
      .check-grid { grid-template-columns: 1fr; }
    }

    @media (max-width: 880px) {
      .grid-two { grid-template-columns: 1fr; }
      .hero-top { flex-direction: column; }
            .hero-main { grid-template-columns: 1fr; }
            .hero-photo { max-height: 260px; }
    }
  </style>
</head>

  <script>
    (function () {
      const data = JSON.parse(document.getElementById("carData").textContent);
      const { vehicle, history, check, motTests, valuations, features } = data;

      const fmtCurrency = (n) => n == null ? "N/A" : new Intl.NumberFormat("en-GB", { style: "currency", currency: "GBP", maximumFractionDigits: 0 }).format(n);
      const fmtNum = (n) => n == null ? "N/A" : new Intl.NumberFormat("en-GB").format(n);
      const fmtDate = (v) => {
        if (!v) return "N/A";
        const d = new Date(v);
        if (Number.isNaN(d.getTime())) return "N/A";
        return new Intl.DateTimeFormat("en-GB", { day: "2-digit", month: "short", year: "numeric" }).format(d);
      };

      const latestMot = [...(motTests || [])].sort((a, b) => new Date(b.completedDate) - new Date(a.completedDate))[0];

      const setText = (id, text) => {
        const node = document.getElementById(id);
        if (node) node.textContent = text;
      };

      setText("title", `${vehicle.make} ${vehicle.model} ${vehicle.trim || ""}`.trim());
      setText("subtitle", `${vehicle.derivative} | ${vehicle.firstRegistrationDate ? new Date(vehicle.firstRegistrationDate).getFullYear() : "Unknown Year"}`);
      setText("plate", vehicle.registration || "No Plate");

      const chips = [
        { text: vehicle.ownershipCondition || "Unknown Condition", cls: "" },
        { text: vehicle.fuelType || "Unknown Fuel", cls: "" },
        { text: vehicle.transmissionType || "Unknown Gearbox", cls: "" },
        { text: history.scrapped ? "Scrapped" : "Not Scrapped", cls: history.scrapped ? "bad" : "ok" },
        { text: history.stolen ? "Stolen Marker" : "No Stolen Marker", cls: history.stolen ? "bad" : "ok" },
        { text: history.imported ? "Imported" : "Not Imported", cls: history.imported ? "" : "ok" }
      ];
      document.getElementById("statusChips").innerHTML = chips.map((chip) => `<span class="chip ${chip.cls}">${chip.text}</span>`).join("");

      const kpis = [
        ["Retail", fmtCurrency(valuations?.retail?.amountGBP)],
        ["Private", fmtCurrency(valuations?.private?.amountGBP)],
        ["Part Exchange", fmtCurrency(valuations?.partExchange?.amountGBP)],
        ["Latest Mileage", latestMot ? `${fmtNum(latestMot.odometerValue)} ${latestMot.odometerUnit}` : "N/A"],
        ["MOT Status", latestMot ? latestMot.testResult : "N/A"],
        ["MOT Expiry", latestMot ? fmtDate(latestMot.expiryDate) : "N/A"],
        ["Owners", fmtNum(vehicle.owners)],
        ["Road Tax", fmtCurrency(vehicle.vehicleExciseDutyWithoutSupplementGBP)]
      ];
      document.getElementById("kpis").innerHTML = kpis.map(([label, value]) => `<article class="kpi"><p class="kpi-label">${label}</p><p class="kpi-value">${value}</p></article>`).join("");

      const specs = [
        ["VIN", vehicle.vin],
        ["Engine", `${vehicle.badgeEngineSizeLitres || ""}L / ${fmtNum(vehicle.enginePowerBHP)} bhp`],
        ["Engine Capacity", `${fmtNum(vehicle.engineCapacityCC)} cc`],
        ["0-100 km/h", vehicle.zeroToOneHundredKMPHSeconds ? `${vehicle.zeroToOneHundredKMPHSeconds}s` : "N/A"],
        ["Top Speed", vehicle.topSpeedMPH ? `${vehicle.topSpeedMPH} mph` : "N/A"],
        ["CO2", vehicle.co2EmissionGPKM ? `${vehicle.co2EmissionGPKM} g/km` : "N/A"],
        ["Combined MPG", vehicle.fuelEconomyNEDCCombinedMPG ? `${vehicle.fuelEconomyNEDCCombinedMPG} mpg` : "N/A"],
        ["Emission Class", vehicle.emissionClass],
        ["Body", `${vehicle.bodyType || "N/A"}, ${vehicle.doors || "?"} doors, ${vehicle.seats || "?"} seats`],
        ["Drivetrain", vehicle.drivetrain],
        ["Dimensions", `${fmtNum(vehicle.lengthMM)} x ${fmtNum(vehicle.widthMM)} x ${fmtNum(vehicle.heightMM)} mm`],
        ["Fuel Tank", vehicle.fuelCapacityLitres ? `${vehicle.fuelCapacityLitres} L` : "N/A"]
      ];
      document.getElementById("specs").innerHTML = specs.map(([label, value]) => `<article class="spec-item"><p class="spec-label">${label}</p><p class="spec-value">${value || "N/A"}</p></article>`).join("");

      const valuationRows = [
        ["Retail", valuations?.retail?.amountGBP],
        ["Private", valuations?.private?.amountGBP],
        ["Trade", valuations?.trade?.amountGBP],
        ["Part Exchange", valuations?.partExchange?.amountGBP]
      ];
      document.getElementById("valuations").innerHTML = valuationRows.map(([label, amount]) => `<article class="spec-item"><p class="spec-label">${label}</p><p class="spec-value">${fmtCurrency(amount)}</p></article>`).join("");

      const historyRows = [
        ["First Registered", fmtDate(vehicle.firstRegistrationDate)],
        ["Year of Manufacture", history.yearOfManufacture || "N/A"],
        ["Current Colour", vehicle.oem?.colour || vehicle.colour || "N/A"],
        ["Previous Owners", history.previousOwners],
        ["Latest Keeper Change", fmtDate(history?.keeperChanges?.[0]?.dateOfLastKeeper)],
        ["Latest V5C Issued", fmtDate(history?.v5cs?.[0]?.issuedDate)],
        ["Imported", history.imported ? "Yes" : "No"],
        ["Exported", history.exported ? "Yes" : "No"],
        ["Scrapped", history.scrapped ? "Yes" : "No"],
        ["Stolen Marker", history.stolen ? "Yes" : "No"]
      ];
      document.getElementById("history").innerHTML = historyRows.map(([label, value]) => `<article class="spec-item"><p class="spec-label">${label}</p><p class="spec-value">${value ?? "N/A"}</p></article>`).join("");

      const motList = [...(motTests || [])].sort((a, b) => new Date(b.completedDate) - new Date(a.completedDate));
      document.getElementById("motTimeline").innerHTML = motList.map((test) => {
        const comments = (test.rfrAndComments || []).map((c) => `<li>${c.type}: ${c.text}</li>`).join("");
        const statusClass = test.testResult && test.testResult.toLowerCase() === "passed" ? "pass" : "fail";
        return `<li><div class="row"><strong>${fmtDate(test.completedDate)}</strong><span class="badge ${statusClass}">${test.testResult || "Unknown"}</span></div><div class="row"><span>${fmtNum(test.odometerValue)} ${test.odometerUnit || ""}</span><span>Expires: ${fmtDate(test.expiryDate)}</span></div>${comments ? `<ul class="notes">${comments}</ul>` : ""}</li>`;
      }).join("");

      if (check) {
        const flagDefs = [
          { label: "High Risk",              val: check.highRisk,             alert: true },
          { label: "Stolen",                 val: check.stolen,               alert: true },
          { label: "Scrapped",               val: check.scrapped,             alert: true },
          { label: "Write-off",              val: !!check.insuranceWriteoffCategory, alert: true, extra: check.insuranceWriteoffCategory ? ` (Cat ${check.insuranceWriteoffCategory})` : "" },
          { label: "Private Finance",        val: check.privateFinance,       alert: true },
          { label: "Trade Finance",          val: check.tradeFinance,         alert: true },
          { label: "Mileage Discrepancy",    val: check.mileageDiscrepancy,   alert: true },
          { label: "Registration Changed",   val: check.registrationChanged,  alert: false, warn: true },
          { label: "Colour Changed",         val: check.colourChanged,        alert: false, warn: true },
          { label: "Imported",               val: check.imported,             alert: false, warn: true },
          { label: "Exported",               val: check.exported,             alert: false, warn: true },
        ];
        document.getElementById("checkFlags").innerHTML = flagDefs.map(({ label, val, alert, warn, extra = "" }) => {
          if (val) {
            const cls = alert ? "alert" : warn ? "warn" : "clear";
            return `<span class="flag ${cls}">&#9888; ${label}${extra}</span>`;
          }
          return `<span class="flag clear">&#10003; No ${label}</span>`;
        }).join("");

        const plateChanges = check.plateChanges || [];
        document.getElementById("plateChanges").innerHTML = plateChanges.length
          ? plateChanges.map(p => `<li class="plate-change-item"><span class="plate-tag">${p.previousRegistration}</span><span class="plate-arrow">&#8594; changed to &#8594;</span><span class="plate-tag">${p.currentRegistration}</span><span style="color:var(--ink-soft);font-size:0.83rem;margin-left:auto">${fmtDate(p.startDate)}</span></li>`).join("")
          : `<li style="color:var(--ink-soft);font-size:0.9rem;">No plate changes recorded</li>`;

        const dvla = check.dvlaVehicle || {};
        const dvlaRows = [
          ["Make", dvla.make],
          ["Model", dvla.model],
          ["Body Type", dvla.bodyType],
          ["Fuel Type", dvla.fuelType],
          ["Transmission", dvla.transmissionType],
          ["Engine", dvla.engineCapacityCC ? `${fmtNum(dvla.engineCapacityCC)} cc` : null],
          ["Colour", dvla.colour],
          ["CO2", dvla.co2EmissionsGKM ? `${dvla.co2EmissionsGKM} g/km` : null],
        ];
        document.getElementById("dvlaSpecs").innerHTML = dvlaRows.map(([label, value]) =>
          `<article class="spec-item"><p class="spec-label">${label}</p><p class="spec-value">${value || "N/A"}</p></article>`
        ).join("");

        const readings = (check.odometerReadings || []).slice().sort((a, b) => new Date(b.performed) - new Date(a.performed));
        document.getElementById("odometerBody").innerHTML = readings.length
          ? readings.map(r => `<tr><td>${fmtDate(r.performed)}</td><td>${r.source}</td><td>${fmtNum(r.odometerReadingMiles)} miles</td></tr>`).join("")
          : `<tr><td colspan="3" style="color:var(--ink-soft)">No readings recorded</td></tr>`;
      } else {
        const sec = document.getElementById("checkSection");
        if (sec) sec.style.display = "none";
      }

      const grouped = (features || []).reduce((acc, feature) => {
        const key = feature.category || "Other";
        if (!acc[key]) acc[key] = [];
        acc[key].push(feature);
        return acc;
      }, {});

      document.getElementById("features").innerHTML = Object.entries(grouped)
        .sort((a, b) => b[1].length - a[1].length)
        .map(([category, list], index) => {
          const std = list.filter((f) => (f.type || "").toLowerCase() === "standard").length;
          const opt = list.filter((f) => (f.type || "").toLowerCase() === "optional").length;
          const items = list
            .sort((a, b) => a.name.localeCompare(b.name))
            .map((f) => {
              const badges = [f.type, f.rarityRating, f.valueRating].filter(Boolean).join(" | ");
              return `<li class="feature-item"><p class="feature-name">${f.name}</p><p class="feature-meta">${badges || "No extra metadata"}</p></li>`;
            })
            .join("");
          return `<details ${index < 3 ? "open" : ""}><summary><span>${category}</span><span class="summary-meta">${list.length} total | ${std} standard | ${opt} optional</span></summary><ul class="feature-list">${items}</ul></details>`;
        })
        .join("");
    })();
  </script>
