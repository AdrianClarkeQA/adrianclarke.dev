<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Adrian Clarke — CV</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow:ital,wght@0,400;0,500;0,600;0,700;1,600&family=Geist:wght@300;400;500&family=Geist+Mono:wght@300;400&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="/css/style.css">

  <!-- Theme — must run synchronously before paint to prevent flash -->
  <script src="/js/theme.js"></script>
</head>
<body>

  <!-- NAV -->
  <div id="nav-placeholder"></div>
  <script src="/js/nav-loader.js" defer></script>

  <!-- CV HERO — JSON left, photo right -->
  <section class="hero">

    <div class="cv-hero-content">
      <p class="cv-eyebrow">Curriculum Vitae</p>
      <div class="json-container">
        <pre class="json-pre" id="json-output">Loading…</pre>
      </div>
      <div class="cv-footer">
        <a href="/pages/curriculum-vitae.html" class="btn-primary">Print-friendly version</a>
        <!-- <a href="/data/cv.json" download class="btn-primary">Download JSON ↓</a> -->
        <a href="/index.html" class="btn-ghost">← Back to home</a>
      </div>
    </div>

    <div class="hero-photo">
      <img id="avatar-img" alt="Adrian Clarke">
      <script src="/js/avatar.js"></script>
    </div>

  </section>

  <div class="cv-modal" id="cv-modal" hidden>
    <div class="cv-modal-backdrop" data-close-modal></div>
    <div class="cv-modal-dialog" role="dialog" aria-modal="true" aria-labelledby="cv-modal-title">
      <div class="cv-modal-toolbar">
        <h2 class="cv-modal-title" id="cv-modal-title">Curriculum Vitae</h2>
        <div class="cv-modal-actions">
          <button type="button" class="btn-ghost cv-modal-print" id="cv-modal-print">Print</button>
          <button type="button" class="btn-ghost cv-modal-close" data-close-modal aria-label="Close CV modal">Close</button>
        </div>
      </div>
      <div class="cv-modal-content" id="cv-modal-content">
        <p class="cv-doc-loading">Loading document...</p>
      </div>
    </div>
  </div>

  <!-- FOOTER -->
  <div data-include="/pages/footer.html"></div>

  <!-- Components loader — must be last -->
  <script src="/js/cv.js"></script>
  <script src="/js/footer-loader.js"></script>

</body>
</html>
